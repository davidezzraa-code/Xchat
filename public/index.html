<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranger 1v1 Chat</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #1a73e8;
            --card-bg: #121212;
            --border-color: #333333;
            --success-color: #2ea44f;
            --danger-color: #cb2431;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* LOGIN INTERFACE SCREEN */
        #auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .auth-btn {
            width: 260px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        .google-btn { background-color: #ffffff; color: #000000; }
        .guest-btn { background-color: var(--accent-color); color: #ffffff; }

        /* APPLICATION PANEL GRID */
        #app-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            grid-template-columns: 280px 1fr 300px;
        }

        .sidebar, .right-bar {
            background-color: #0a0a0a;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .right-bar { border-right: none; border-left: 1px solid var(--border-color); }

        .section-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .chat-area { display: flex; flex-direction: column; background-color: var(--bg-color); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 70%; padding: 10px 14px; border-radius: 8px; }
        .msg-me { align-self: flex-end; background-color: var(--accent-color); }
        .msg-them { align-self: flex-start; background-color: #262626; }
        .msg-system { align-self: center; background-color: #222; color: #aaa; font-size: 13px; }

        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .chat-input { flex: 1; background-color: #161616; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; color: #fff; }
        
        .action-btn { padding: 6px 12px; border-radius: 4px; color: white; cursor: pointer; border: none; font-size: 12px; }
        .btn-add { background-color: var(--accent-color); }
        .btn-accept { background-color: var(--success-color); }
        .btn-deny { background-color: var(--danger-color); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- STAGE 1: AUTH SELECTION -->
    <div id="auth-screen">
        <h2>1v1 Stranger Chat</h2>
        <button class="auth-btn google-btn" onclick="initApp('Google User')">Sign in with Google</button>
        <button class="auth-btn guest-btn" onclick="initApp('Guest_' + Math.floor(Math.random()*1000))">Match as Guest</button>
    </div>

    <!-- STAGE 2: LIVE WINDOW WORKSPACE -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="section-header">Friend Requests</div>
            <div id="requests-list" style="padding:10px;"></div>
        </div>

        <div class="chat-area">
            <div class="section-header">
                <span id="chat-title">Finding someone...</span>
                <button class="action-btn btn-add hidden" id="add-friend-btn" onclick="sendReq()">Add Friend</button>
            </div>
            <div class="chat-messages" id="msg-container"></div>
            <div class="chat-input-area">
                <button class="action-btn btn-deny" onclick="nextMatch()">Next</button>
                <input type="text" class="chat-input" id="msg-input" placeholder="Type a message...">
                <button class="action-btn btn-add" style="padding:0 20px" onclick="sendMsg()">Send</button>
            </div>
        </div>

        <div class="right-bar">
            <div class="section-header">Friend Chat Box</div>
            <div id="friends-list" style="padding:10px;"></div>
        </div>
    </div>

    <script>
        let user = null, stranger = null, friends = [], requests = [];
        
        function initApp(name) {
            user = name;
            document.getElementById('auth-screen').classList.add('hidden');
            const main = document.getElementById('app-screen');
            main.style.display = 'grid';
            nextMatch();
        }

        function nextMatch() {
            const pool = ["ShadowWanderer", "NeonVibes", "QuantumCoder", "SilentGhost"];
            stranger = pool[Math.floor(Math.random()*pool.length)];
            document.getElementById('chat-title').innerText = `Chatting with: ${stranger}`;
            document.getElementById('msg-container').innerHTML = `<div class="message msg-system">Matched with ${stranger}</div>`;
            document.getElementById('add-friend-btn').classList.remove('hidden');
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            if(!input.value.trim()) return;
            
            const msg = document.createElement('div');
            msg.className = "message msg-me";
            msg.innerText = input.value;
            document.getElementById('msg-container').appendChild(msg);
            input.value = "";
        }

        function sendReq() {
            alert("Friend request sent to " + stranger);
            // Simulating an incoming mock friend request for layout demonstration
            setTimeout(() => {
                requests.push("Stranger_Alpha");
                renderReqs();
            }, 1000);
        }

        function renderReqs() {
            const box = document.getElementById('requests-list');
            box.innerHTML = requests.map((r, i) => `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; background:#111; padding:10px; border-radius:6px;">
                    <span>${r}</span>
                    <div>
                        <button class="action-btn btn-accept" onclick="accept(${i})">✓</button>
                        <button class="action-btn btn-deny" onclick="deny(${i})">✗</button>
                    </div>
                </div>
            `).join('');
        }

        function accept(i) {
            friends.push(requests[i]);
            requests.splice(i, 1);
            renderReqs();
            renderFriends();
        }

        function deny(i) {
            requests.splice(i, 1);
            renderReqs();
        }

        function renderFriends() {
            const box = document.getElementById('friends-list');
            box.innerHTML = friends.map(f => `
                <div style="padding:12px; background:#121212; border:1px solid #333; margin-bottom:8px; border-radius:6px; cursor:pointer;">
                    🟢 ${f} (Online Chat)
                </div>
            `).join('');
        }
    </script>
</body>
</html>
